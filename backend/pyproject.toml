[tool.poetry]
name = "phylograph-api"
version = "0.1.0"
description = "FastAPI backend for PhyloGraph RDF visualization"
authors = [""]
package-mode = false
packages = [
    { include = "app" }
]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.95.0"
uvicorn = "^0.21.1"
rdflib = "^6.3.2"
networkx = "^3.1"
pandas = "^2.0.0"
pydantic = "^1.10.7"
python-dotenv = "^1.0.0"
loguru = "^0.7.3"
python-multipart = "^0.0.20"
community = "^1.0.0b1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.3.1"
black = "^23.3.0"
isort = "^5.12.0"
mypy = "^1.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"